<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bracket</title>

<style>

body{
    margin:0;
    background:#2b2b2b;
    font-family:Arial;
}

.wrapper{
    width:100vw;
    height:100vh;

    overflow:auto;

    padding:40px;

    box-sizing:border-box;
}

.grid{
    display:grid;

    grid-template-columns:repeat(9, 180px);
    grid-template-rows:repeat(11, 100px);

    gap:10px;

    width:max-content;
}

.item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align: center;
}

.match{
    width:160px;

    background:#1f1f1f;

    border-radius:10px;

    overflow:hidden;

    box-shadow:0 0 10px rgba(0,0,0,.3);
}

.player{
    padding:10px;

    border-bottom:1px solid #555;

    color:white;

    transition:.2s;
}

.player:last-child{
    border-bottom:none;
}

.winner{
    background:#43a047;
}

.loser{
    background: red;
}

.pending{
    background:#616161;
}

.label{
    margin-top:5px;

    color:white;
    font-size:12px;

    opacity:.8;
}

</style>
</head>

<body>

<div class="wrapper">
    <div class="grid"></div>
</div>

<script>

const posiciones = [

    [1,1,"juego 1"],
    [1,3,"juego 2"],
    [1,5,"juego 3"],
    [1,7,"juego 4"],
    [1,9,"juego 9"],
    [1,11,"juego 10"],

    [2,2,"juego 13"],
    [2,6,"juego 14"],

    [3,4,"juego 21"],

    [9,1,"juego 5"],
    [9,3,"juego 6"],
    [9,5,"juego 7"],
    [9,7,"juego 8"],
    [9,9,"juego 11"],
    [9,11,"juego 12"],

    [8,2,"juego 15"],
    [8,6,"juego 16"],

    [7,4,"juego 22"],

    [5,4,"juego 27"],

    [2,9,"juego 17"],
    [8,9,"juego 19"],
    [2,11,"juego 18"],
    [8,11,"juego 20"],

    [3,10,"juego 23"],
    [7,10,"juego 24"],

    [4,10,"juego 25"],
    [6,10,"juego 26"],

    [5,10,"juego 28"],

    [5,8,"juego 29"],

    [5,6,"juego 30 [Final]"]

];

async function cargarEmparejamientos(){

    const res = await fetch("emparejamientos.json");
    const emparejamientos = await res.json();

    const grid = document.querySelector(".grid");

    grid.innerHTML = "";

    posiciones.forEach(([x,y,juego]) => {

        const datos = emparejamientos[juego];

        let clase1 = "pending";
        let clase2 = "pending";

        if(datos.score1 > datos.score2){
            clase1 = "winner";
            clase2 = "loser";
        }
        else if(datos.score2 > datos.score1){
            clase1 = "loser";
            clase2 = "winner";
        }

        const item = document.createElement("div");

        item.classList.add("item");

        item.style.gridColumn = x;
        item.style.gridRow = y;

        item.innerHTML = `
            <div class="match">

                <div class="player ${clase1}">
                    ${datos.jugador1}
                </div>

                <div class="player ${clase2}">
                    ${datos.jugador2}
                </div>

            </div>

            <div class="label">
                ${juego}
            </div>
        `;

        grid.appendChild(item);

    });

}

cargarEmparejamientos();

setInterval(cargarEmparejamientos, 5000);

</script>

</body>
</html>
